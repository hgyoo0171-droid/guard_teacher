name: TeachGuard AI CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: studio-6453048279-17b21
  REGION: asia-northeast3
  REPO_NAME: teachguard-repo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. GCP 인증 (Workload Identity Federation 권장)
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 2. gcloud CLI 설정
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Docker 인증 (Artifact Registry)
      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 4. 백엔드 빌드 및 푸시
      - name: Build & Push Backend
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}

      # 5. 프론트엔드 빌드 및 푸시
      - name: Build & Push Frontend
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }} ./frontend
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}

      # 6. 백엔드 Cloud Run 배포
      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: teachguard-backend
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--service-account=teachguard-ai-ci-cd@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # 7. 프론트엔드 Cloud Run 배포
      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: teachguard-frontend
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--service-account=teachguard-ai-ci-cd@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
